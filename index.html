<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Конвертер">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Конвертер</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#1f232d;--key:#171a22;--keyp:#252a35;--text:#eef0f4;--muted:#8a909c;--gold:#d6b48a;--red:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#upd{color:#b4bac5;font-size:15px;line-height:1.4}
#upd b{font-weight:400}
#upd.err{color:#f0a35e}
.iconbtn{width:60px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#list{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.del{position:absolute;inset:0;background:var(--red);display:flex;align-items:center;padding:0 24px;font-weight:600}
.del.r{justify-content:flex-end}
.row.lift{z-index:3;overflow:visible;border-bottom-color:transparent}
.row.lift .fg{background:#232835;box-shadow:0 8px 24px rgba(0,0,0,.5);border-radius:12px;transform:scale(1.03)}
.row.lift .del{display:none}
.row.shift{transition:transform .15s}
.fg{position:relative;background:var(--card);display:flex;align-items:center;gap:14px;padding:13px 16px;touch-action:pan-y}
.fg.anim{transition:transform .2s}
.flag{width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:50px;line-height:1;flex:none;background:#2a2f3a}
.flag span{transform:scale(1.05)}
.flag.txt{font-size:13px;font-weight:600;color:var(--gold)}
.code{font-size:17px;flex:none}
.code small{display:block;color:var(--muted);font-size:11px;margin-top:2px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{margin-left:auto;font-size:19px;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.act .fg{background:#191d27}
.row.act .val{color:var(--gold)}
.row.act .val::after{content:"";display:inline-block;width:2px;height:20px;background:var(--gold);margin-left:2px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
.row.act.fresh .val::after{display:none}
@keyframes bl{50%{opacity:0}}
#add{align-self:center;margin:12px 0;width:96px;height:40px;border-radius:20px;border:0;background:var(--key);color:var(--text);font-size:26px;font-weight:300}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{height:min(68px,8.5vh);border:0;border-radius:14px;background:var(--key);color:var(--text);font-size:28px;font-weight:300}
#pad button:active,#add:active,.iconbtn:active{background:var(--keyp)}
#pad svg{width:28px;height:28px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;height:82%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px 16px env(safe-area-inset-bottom)}
#sheet .top{display:flex;gap:10px;margin-bottom:10px}
#q{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:16px;user-select:text;-webkit-user-select:text}
#close{border:0;background:none;color:var(--gold);font-size:16px}
#all{overflow-y:auto;flex:1}
#all .fg{border-bottom:1px solid var(--line);padding:11px 4px}
#all .fg.has{opacity:.4}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:#2a2f3a;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div id="upd">Курс обновлён<br><b id="when">—</b></div>
  <button class="iconbtn" id="refresh" aria-label="Обновить курс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4"/></svg></button>
</header>
<div id="list"></div>
<button id="add" aria-label="Добавить валюту">+</button>
<div id="pad">
  <button>7</button><button>8</button><button>9</button>
  <button>4</button><button>5</button><button>6</button>
  <button>1</button><button>2</button><button>3</button>
  <button>0</button><button>,</button>
  <button id="bs" aria-label="Стереть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button>
</div>
<div id="sheet"><div class="box">
  <div class="top"><input id="q" placeholder="Поиск: доллар, EUR, Тайланд…" autocomplete="off"><button id="close">Готово</button></div>
  <div id="all"></div>
</div></div>
<div id="toast"></div>

<script>
// Названия валют. Флаг берётся по коду страны (первые 2 буквы кода валюты).
const NAMES={USD:'Доллар США',EUR:'Евро',RUB:'Рубль',UAH:'Гривна',VND:'Вьетнамский донг',GEL:'Грузинский лари',AED:'Дирхам ОАЭ',THB:'Тайский бат',TRY:'Турецкая лира',GBP:'Фунт стерлингов',CNY:'Юань',JPY:'Иена',KZT:'Тенге',PLN:'Злотый',CZK:'Чешская крона',CHF:'Швейцарский франк',IDR:'Индонезийская рупия',KRW:'Вона',INR:'Индийская рупия',MYR:'Малайзийский ринггит',SGD:'Сингапурский доллар',PHP:'Филиппинское песо',KHR:'Камбоджийский риель',LAK:'Лаосский кип',AMD:'Армянский драм',AZN:'Азербайджанский манат',BYN:'Белорусский рубль',KGS:'Киргизский сом',UZS:'Узбекский сум',MDL:'Молдавский лей',RON:'Румынский лей',HUF:'Форинт',BGN:'Болгарский лев',RSD:'Сербский динар',ILS:'Шекель',EGP:'Египетский фунт',CAD:'Канадский доллар',AUD:'Австралийский доллар',HKD:'Гонконгский доллар',SAR:'Саудовский риял',QAR:'Катарский риал',MXN:'Мексиканское песо',BRL:'Бразильский реал',ARS:'Аргентинское песо',SEK:'Шведская крона',NOK:'Норвежская крона',DKK:'Датская крона',LKR:'Шри-ланкийская рупия',NPR:'Непальская рупия',MNT:'Тугрик',TJS:'Сомони',TWD:'Тайваньский доллар',NZD:'Новозеландский доллар',ZAR:'Рэнд',MAD:'Марокканский дирхам',OMR:'Оманский риал',KWD:'Кувейтский динар',BHD:'Бахрейнский динар',JOD:'Иорданский динар'};
// Примерные курсы к доллару — нужны только если приложение впервые открыто без интернета.
const SEED={USD:1,EUR:.881,RUB:81,UAH:45.6,VND:25840,GEL:2.59,AED:3.6725,THB:32.5,TRY:42,GBP:.75,CNY:7.1,KZT:530,PLN:3.75};
const KEY='converter-v1';
const $=s=>document.querySelector(s);

let st=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rates&&s.list)return s}catch(e){}
  return {rates:SEED,time:null,list:['VND','USD','GEL','RUB','UAH','EUR','AED'],active:'RUB',input:'450',fresh:true};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function flag(c){
  if(c==='EUR')return '🇪🇺';
  const cc=c.slice(0,2);
  if(!/^[A-Z]{2}$/.test(cc)||['XA','XC','XD','XO','XP','XB','XS'].includes(cc))return null;
  return String.fromCodePoint(...[...cc].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));
}
function flagHTML(c){const f=flag(c);return f?`<div class="flag"><span>${f}</span></div>`:`<div class="flag txt">${c.slice(0,3)}</div>`}

const num=s=>parseFloat((s||'0').replace(',','.'))||0;
function fmt(v){
  if(!isFinite(v))return '0';
  const d=Math.abs(v)>=1?2:Math.abs(v)>=0.01?4:6;
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d}).format(v).replace(/ | /g,' ');
}
// Как показать то, что набирается: группы тысяч, запятая.
function fmtInput(s){
  const [a,b]=s.split(',');
  const g=(a||'0').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return b===undefined?g:g+','+b;
}

function render(){
  const base=num(st.input)/(st.rates[st.active]||1);
  $('#list').innerHTML=st.list.map(c=>{
    const v=c===st.active?fmtInput(st.input):fmt(base*(st.rates[c]||0));
    const cls=c===st.active?'row act'+(st.fresh?' fresh':''):'row';
    return `<div class="${cls}" data-c="${c}"><div class="del">Удалить</div><div class="fg">${flagHTML(c)}<div class="code">${c}</div><div class="val">${st.rates[c]?v:'нет курса'}</div></div></div>`;
  }).join('');
  $('#when').textContent=st.time?new Date(st.time).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).replace('.',''):'примерный, нажмите ⟳';
  save();
}

// Клавиатура
$('#pad').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='bs'){st.input=st.fresh?'0':(st.input.slice(0,-1)||'0');st.fresh=false;render();return}
  const k=b.textContent;
  let s=st.fresh?'0':st.input;st.fresh=false;
  if(k===','){if(!s.includes(','))s+=','}
  else{
    const [a,d]=s.split(',');
    if(d!==undefined){if(d.length<6)s+=k}
    else if(a.length<12)s=a==='0'?k:s+k;
  }
  st.input=s;render();
});
// Долгое нажатие на «стереть» — очистить
let bsT;
$('#bs').addEventListener('touchstart',()=>{bsT=setTimeout(()=>{st.input='0';st.fresh=false;render()},500)},{passive:true});
['touchend','touchcancel'].forEach(ev=>$('#bs').addEventListener(ev,()=>clearTimeout(bsT)));

// Нажатие на строку = сделать валюту активной (число переносится, первая цифра заменит его).
// Свайп вправо или влево = удалить. Долгое нажатие = поднять валюту и перетащить выше/ниже.
let sw=null;
$('#list').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.row');if(!row)return;
  sw={row,fg:row.querySelector('.fg'),x:e.clientX,y:e.clientY,dx:0,drag:false,move:false};
  sw.timer=setTimeout(()=>startMove(sw),450);
});
function startMove(s){
  if(sw!==s||s.drag)return;
  s.move=true;s.rows=[...document.querySelectorAll('#list .row')];s.from=s.rows.indexOf(s.row);s.to=s.from;s.h=s.row.offsetHeight;
  s.row.classList.add('lift');s.rows.forEach(r=>r!==s.row&&r.classList.add('shift'));
  if(navigator.vibrate)navigator.vibrate(15);
}
// Пока валюта поднята, страница не должна прокручиваться.
document.addEventListener('touchmove',e=>{if(sw&&(sw.move||sw.drag))e.preventDefault()},{passive:false});
window.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(sw.move){
    const max=(sw.rows.length-1-sw.from)*sw.h,min=-sw.from*sw.h;
    const y=Math.max(min,Math.min(max,dy));
    sw.row.style.transform=`translateY(${y}px)`;
    sw.to=Math.max(0,Math.min(sw.rows.length-1,sw.from+Math.round(y/sw.h)));
    sw.rows.forEach((r,i)=>{if(r===sw.row)return;
      let t=0;if(i>sw.from&&i<=sw.to)t=-sw.h;else if(i<sw.from&&i>=sw.to)t=sw.h;
      r.style.transform=t?`translateY(${t}px)`:''});
    return;
  }
  if(!sw.drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){sw.drag=true;clearTimeout(sw.timer)}
  if(!sw.drag){if(Math.abs(dy)>10||Math.abs(dx)>10){clearTimeout(sw.timer);sw=null}return}
  sw.dx=dx;sw.fg.style.transform=`translateX(${dx}px)`;
  const d=sw.row.querySelector('.del');d.classList.toggle('r',dx<0);
});
window.addEventListener('pointerup',()=>{
  if(!sw)return;const s=sw;sw=null;clearTimeout(s.timer);
  const {row,fg,dx,drag}=s,c=row.dataset.c;
  if(s.move){
    const [x]=st.list.splice(s.from,1);st.list.splice(s.to,0,x);render();return;
  }
  if(!drag){activate(c);return}
  fg.classList.add('anim');
  if(Math.abs(dx)>row.offsetWidth*0.35){
    if(st.list.length<=1){fg.style.transform='';toast('Нужна хотя бы одна валюта');return}
    fg.style.transform=`translateX(${dx>0?'':'-'}${row.offsetWidth}px)`;
    setTimeout(()=>remove(c),180);
  }else fg.style.transform='';
});
window.addEventListener('pointercancel',()=>{if(!sw)return;clearTimeout(sw.timer);if(sw.move)render();else sw.fg.style.transform='';sw=null});
$('#list').addEventListener('contextmenu',e=>e.preventDefault());

function activate(c){
  if(c===st.active){st.fresh=!st.fresh?true:st.fresh;render();return}
  if(!st.rates[c])return;
  const base=num(st.input)/(st.rates[st.active]||1);
  const v=Math.round(base*st.rates[c]*100)/100;
  st.active=c;st.input=String(v).replace('.',',');st.fresh=true;render();
}
let undo=null;
function remove(c){
  const i=st.list.indexOf(c);st.list.splice(i,1);
  if(st.active===c){const n=st.list[0];const base=num(st.input)/(st.rates[c]||1);st.active=n;st.input=String(Math.round(base*st.rates[n]*100)/100).replace('.',',');st.fresh=true}
  undo={c,i};render();toast(`${c} удалена`);
}

// Обновление курса
async function refresh(manual){
  const btn=$('#refresh');btn.classList.add('spin');
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
    const j=await r.json();
    if(j.result!=='success')throw 0;
    st.rates=j.rates;st.time=Date.now();$('#upd').classList.remove('err');render();
    if(manual)toast('Курс обновлён');
  }catch(e){
    $('#upd').classList.add('err');
    if(manual)toast('Нет интернета — курс от последнего обновления');
  }finally{btn.classList.remove('spin')}
}
$('#refresh').onclick=()=>refresh(true);

// Добавление валюты
function drawAll(){
  const q=$('#q').value.trim().toLowerCase();
  const codes=Object.keys(st.rates).sort((a,b)=>(NAMES[b]?1:0)-(NAMES[a]?1:0)||a.localeCompare(b));
  $('#all').innerHTML=codes.filter(c=>!q||c.toLowerCase().includes(q)||(NAMES[c]||'').toLowerCase().includes(q))
    .map(c=>`<div class="fg${st.list.includes(c)?' has':''}" data-c="${c}">${flagHTML(c)}<div class="code">${c}<small>${NAMES[c]||''}</small></div><div class="val" style="font-size:22px">${st.list.includes(c)?'✓':'+'}</div></div>`).join('');
}
$('#add').onclick=()=>{$('#q').value='';drawAll();$('#sheet').classList.add('on')};
$('#q').oninput=drawAll;
$('#close').onclick=()=>$('#sheet').classList.remove('on');
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')});
$('#all').addEventListener('click',e=>{
  const r=e.target.closest('.fg');if(!r)return;const c=r.dataset.c;
  if(st.list.includes(c))return;
  st.list.push(c);render();drawAll();toast(`${c} добавлена`);
});

let tT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2000)}

render();
if(!st.time||Date.now()-st.time>6*3600e3)refresh(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
